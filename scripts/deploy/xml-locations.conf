# Include inside the canonical deiondz.com HTTPS server block.
location = /blog/feed.xml {
    # Browsers receive the readable feed page; RSS readers receive XML.
    if ($http_accept ~* "text/html") {
        return 302 /blog/feed/;
    }
    add_header Vary Accept always;
    include /etc/nginx/snippets/deiondz-proxy.conf;
}

location = /sitemap.xml {
    add_header Content-Disposition inline;
    include /etc/nginx/snippets/deiondz-proxy.conf;
}
