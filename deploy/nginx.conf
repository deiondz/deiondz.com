server {
    listen 80;
    listen [::]:80;
    server_name deiondz.com www.deiondz.com;

    root /var/www/deiondz.com/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
