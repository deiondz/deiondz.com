server {
    listen 80;
    listen [::]:80;
    server_name deiondz.com www.deiondz.com;

    root /var/www/deiondz.com/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name deiondz.com www.deiondz.com;

    ssl_certificate /etc/letsencrypt/live/deiondz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deiondz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/deiondz.com/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
