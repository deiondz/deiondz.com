name: Portfolio CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.artifact.outputs.deploy }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Test CMS content handling
        run: node --test scripts/blog.test.mjs
      - name: Test deployment validation and rollback
        run: python3 scripts/deploy/test_receive.py
      - run: bun run lint
      - run: bun run build
      - run: node --test scripts/ssr.test.mjs
      - run: bun run typecheck
      - name: Package the Next.js server
        id: artifact
        run: |
          test -s .next/standalone/server.js
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          rm -f .next/standalone/.env* .next/standalone/public/blog-version.json
          tar --dereference --hard-dereference -czf portfolio.tar.gz -C .next/standalone .
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio
          path: portfolio.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to deiondz.com
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://deiondz.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" = "$COMMIT" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded commit $COMMIT. main is $latest."
          fi
      - name: Upload and activate the release
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PORTFOLIO_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.PORTFOLIO_HOST }}
          DEPLOY_PORT: ${{ vars.PORTFOLIO_PORT }}
          DEPLOY_USER: ${{ vars.PORTFOLIO_USER }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          umask 077
          key="$RUNNER_TEMP/portfolio-deploy-key"
          hosts="$RUNNER_TEMP/portfolio-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $COMMIT $RUN_ID $RUN_ATTEMPT" < portfolio.tar.gz
      - name: Verify the public release
        if: steps.current.outputs.deploy == 'true'
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 \
            "https://deiondz.com/deployment.json?run=$RUN_ID-$RUN_ATTEMPT" > deployment.json
          python3 - <<'PY'
          import json, os
          with open('deployment.json') as file:
              release = json.load(file)
          assert release['sha'] == os.environ['COMMIT'], release
          assert release['run_id'] == os.environ['RUN_ID'], release
          assert release['attempt'] == os.environ['RUN_ATTEMPT'], release
          print('Verified public release:', release['sha'])
          PY
          curl -fsS --retry 3 --retry-all-errors --max-time 20 https://deiondz.com/ -o /dev/null
          curl -fsS --retry 3 --retry-all-errors --max-time 20 https://deiondz.com/blog/ -o /dev/null
          curl -fsS --retry 3 --retry-all-errors --max-time 20 https://deiondz.com/blog/feed.xml -o /dev/null
          curl -fsS --retry 3 --retry-all-errors --max-time 20 https://deiondz.com/sitemap.xml -o /dev/null
